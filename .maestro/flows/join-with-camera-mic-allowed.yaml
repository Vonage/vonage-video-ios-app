appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      microphone: allow

- extendedWaitUntil:
    visible:
      id: "landing-screen"
    timeout: 10000

- takeScreenshot: 01-landing-screen

# Enter a room name in the text field
- tapOn:
    id: "room-name-input"

- eraseText

- inputText: "testroom"

- hideKeyboard

- waitForAnimationToEnd:
    timeout: 2000

# Navigate to the waiting room
- tapOn:
    id: "join-waiting-room-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 10000

- takeScreenshot: 02-waiting-room-permissions-granted

# Enter username
- tapOn:
    id: "username-input"

- eraseText

- inputText: "Test User"

- tapOn:
    id: "waiting-room-screen"
    point: "50%,55%"

- waitForAnimationToEnd:
    timeout: 2000

# Join the meeting
- tapOn:
    id: "join-meeting-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "meeting-room-screen"
    timeout: 60000

- takeScreenshot: 03-meeting-room-joined
