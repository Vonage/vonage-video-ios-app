appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow

- extendedWaitUntil:
    visible:
      id: "landing-screen"
    timeout: 10000

- takeScreenshot: 01-landing-screen

# Enter a room name in the text field
- tapOn:
    id: "room-name-input"

- inputText: "testroom"

# Navigate to the waiting room
- tapOn:
    id: "join-waiting-room-button"

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 10000

- takeScreenshot: 02-waiting-room-permissions-granted

# Enter username
- tapOn:
    id: "username-input"

- inputText: "Test User"

# Join the meeting
- tapOn:
    id: "join-meeting-button"

- extendedWaitUntil:
    visible:
      id: "meeting-room-screen"
    timeout: 15000

- takeScreenshot: 03-meeting-room-joined
