appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      microphone: allow

- extendedWaitUntil:
    visible:
      id: "landing-screen"
    timeout: 10000

- assertVisible:
    id: "create-new-room-button"

# Tap "Create a new room" — generates random room name and navigates to waiting room
- tapOn:
    id: "create-new-room-button"

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 10000

- takeScreenshot: 01-waiting-room-new-room

# Enter username and join meeting
- tapOn:
    id: "username-input"

- eraseText

- inputText: "Test User"

- tapOn:
    id: "waiting-room-screen"
    point: "50%,55%"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "join-meeting-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "meeting-room-screen"
    timeout: 60000

- takeScreenshot: 02-meeting-room
