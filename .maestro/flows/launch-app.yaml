appId: com.vonage.VERA
---
# Flujo alternativo: Tomar screenshot sin lanzar la app
# (la app debe estar ya iniciada o el script se encargará de lanzarla)

- takeScreenshot: initial-state

# Esperar animaciones
- waitForAnimationToEnd

# Intentar buscar elementos en la pantalla
- assertVisible:
    text: VERA
    optional: true

# Tomar otra captura
- takeScreenshot: app-state
