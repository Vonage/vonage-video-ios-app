appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow
    arguments:
      VERA_E2E_MOCKS: "${VERA_E2E_MOCKS}"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

# Enter a room name
- tapOn:
    id: "room-name-input"

- inputText: "testroom"

- tapOn:
    id: "join-waiting-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

# Enter username and join meeting
- tapOn:
    id: "username-input"

- inputText: "Test User"

- tapOn:
    id: "join-meeting-button"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "meeting-room-screen"

# Open Settings from Meeting Room
# The settings button is in the overflow menu
# First tap the more-options button to reveal the menu
- tapOn:
    id: "meeting-room-more-options-button"

- waitForAnimationToEnd:
    timeout: 2000

# Now tap the settings button from the overflow menu
- tapOn:
    id: "meeting-room-settings-button"

- waitForAnimationToEnd:
    timeout: 3000

# General is the first section; reset remains restricted during a call.
- assertNotVisible:
    id: "settings-reset-defaults-button"

- assertVisible:
    id: "settings-overlay-stats-toggle"

# Follow the shared Video control order, then the native degradation preference.
- scrollUntilVisible:
    element:
      id: "settings-camera-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-camera-picker"

- scrollUntilVisible:
    element:
      id: "settings-self-view-mirror-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-self-view-mirror-toggle"

- scrollUntilVisible:
    element:
      id: "settings-video-bitrate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-video-bitrate-picker"

- scrollUntilVisible:
    element:
      id: "settings-codec-mode-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-codec-mode-locked"

- scrollUntilVisible:
    element:
      id: "settings-frame-rate-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-frame-rate-locked"

- scrollUntilVisible:
    element:
      id: "settings-resolution-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-resolution-locked"


- scrollUntilVisible:
    element:
      id: "settings-video-degradation-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-video-degradation-picker"

- takeScreenshot: 01-settings-meeting-room-video-section

# Screen Sharing is a separate section between Video and Audio.
- scrollUntilVisible:
    element:
      id: "settings-screen-share-content-hint-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-content-hint-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-codec-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-codec-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-frame-rate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-frame-rate-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-resolution-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-resolution-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-bitrate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-bitrate-picker"

- scrollUntilVisible:
    element:
      id: "settings-scalable-screen-share-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-scalable-screen-share-toggle"

# Audio follows Screen Sharing.
- scrollUntilVisible:
    element:
      id: "settings-audio-bitrate-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-audio-bitrate-locked"

- scrollUntilVisible:
    element:
      id: "settings-advanced-noise-suppression-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-advanced-noise-suppression-toggle"

- scrollUntilVisible:
    element:
      id: "settings-opus-dtx-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-opus-dtx-locked"

- scrollUntilVisible:
    element:
      id: "settings-publisher-fallback-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-publisher-fallback-locked"

- scrollUntilVisible:
    element:
      id: "settings-subscriber-fallback-locked"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-subscriber-fallback-locked"

- takeScreenshot: 02-settings-meeting-room-audio-section

# Statistics is the final section.
- scrollUntilVisible:
    element:
      text: "Statistics"
    direction: DOWN
    timeout: 20000
- assertVisible: "Statistics"
