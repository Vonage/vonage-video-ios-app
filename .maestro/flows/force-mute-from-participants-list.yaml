# vera-runner: mock-only
appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow
    arguments:
      VERA_E2E_MOCKS: "${VERA_E2E_MOCKS}"
      VERA_E2E_SCENARIO: "force-mute"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

- tapOn:
    id: "room-name-input"

- inputText: "force-mute-list-room"

- tapOn:
    id: "join-waiting-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

- tapOn:
    id: "username-input"

- inputText: "Moderator"

- tapOn:
    id: "join-meeting-button"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "meeting-room-screen"

- takeScreenshot: 01-list-meeting-room-opened

- extendedWaitUntil:
    visible: "Remote Participant"
    timeout: 5000

- assertVisible:
    id: "participant-card-e2e-remote-participant"

- assertVisible:
    id: "participant-mic-e2e-remote-participant-enabled"

- tapOn:
    id: "meeting-room-participants-button"

- extendedWaitUntil:
    visible:
      id: "participants-list-screen"
    timeout: 5000

- assertVisible: "Remote Participant"

- assertVisible:
    id: "participant-list-force-mute-e2e-remote-participant"

- takeScreenshot: 02-list-force-mute-available

- tapOn:
    id: "participant-list-force-mute-e2e-remote-participant"

- assertVisible: "Mute Remote Participant for everyone in the call? Only Remote Participant can unmute themselves."

- tapOn: "Mute"

- extendedWaitUntil:
    visible: "Remote Participant was muted."
    timeout: 5000

- takeScreenshot: 03-list-force-mute-success-toast

- extendedWaitUntil:
    visible:
      id: "participant-mic-e2e-remote-participant-disabled"
    timeout: 5000

- assertNotVisible:
    id: "participant-list-force-mute-e2e-remote-participant"

- takeScreenshot: 04-list-force-mute-completed
