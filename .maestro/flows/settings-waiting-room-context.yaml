appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow
    arguments:
      VERA_E2E_MOCKS: "${VERA_E2E_MOCKS}"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

# Enter a room name
- tapOn:
    id: "room-name-input"

- inputText: "testroom"

- tapOn:
    id: "join-waiting-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

# Open Settings from Waiting Room
- tapOn:
    id: "waiting-room-settings-button"

- waitForAnimationToEnd:
    timeout: 2000

# General is the first section; reset remains restricted during a call.
- assertVisible:
    id: "settings-reset-defaults-button"

- assertVisible:
    id: "settings-overlay-stats-toggle"

# Follow the shared Video control order, then the native degradation preference.
- scrollUntilVisible:
    element:
      id: "settings-camera-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-camera-picker"

- scrollUntilVisible:
    element:
      id: "settings-self-view-mirror-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-self-view-mirror-toggle"

- scrollUntilVisible:
    element:
      id: "settings-video-bitrate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-video-bitrate-picker"

- scrollUntilVisible:
    element:
      id: "settings-codec-mode-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-codec-mode-picker"

- scrollUntilVisible:
    element:
      id: "settings-frame-rate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-frame-rate-picker"

- scrollUntilVisible:
    element:
      id: "settings-resolution-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-resolution-picker"


- scrollUntilVisible:
    element:
      id: "settings-video-degradation-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-video-degradation-picker"

- takeScreenshot: 01-settings-waiting-room-video-section

# Screen Sharing is a separate section between Video and Audio.
- scrollUntilVisible:
    element:
      id: "settings-screen-share-content-hint-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-content-hint-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-codec-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-codec-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-frame-rate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-frame-rate-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-resolution-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-resolution-picker"

- scrollUntilVisible:
    element:
      id: "settings-screen-share-bitrate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-screen-share-bitrate-picker"

- scrollUntilVisible:
    element:
      id: "settings-scalable-screen-share-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-scalable-screen-share-toggle"

# Audio follows Screen Sharing.
- scrollUntilVisible:
    element:
      id: "settings-audio-bitrate-picker"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-audio-bitrate-picker"

- scrollUntilVisible:
    element:
      id: "settings-advanced-noise-suppression-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-advanced-noise-suppression-toggle"

- scrollUntilVisible:
    element:
      id: "settings-opus-dtx-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-opus-dtx-toggle"

- scrollUntilVisible:
    element:
      id: "settings-publisher-fallback-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-publisher-fallback-toggle"

- scrollUntilVisible:
    element:
      id: "settings-subscriber-fallback-toggle"
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: "settings-subscriber-fallback-toggle"

- takeScreenshot: 02-settings-waiting-room-audio-section

# Statistics is the final section.
- scrollUntilVisible:
    element:
      text: "Statistics"
    direction: DOWN
    timeout: 20000
- assertVisible: "Statistics"
