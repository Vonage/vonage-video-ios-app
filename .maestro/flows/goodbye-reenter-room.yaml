appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow

- extendedWaitUntil:
    visible:
      id: "landing-screen"
    timeout: 10000

# Enter a room name
- tapOn:
    id: "room-name-input"

- inputText: "testroom"

- tapOn:
    id: "join-waiting-room-button"

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 10000

# Enter username and join meeting
- tapOn:
    id: "username-input"

- inputText: "Test User"

- tapOn:
    id: "join-meeting-button"

- extendedWaitUntil:
    visible:
      id: "meeting-room-screen"
    timeout: 30000

- takeScreenshot: 01-meeting-room

# End the call (async disconnect + fullScreenCover dismiss animation)
- tapOn:
    id: "meeting-room-end-call-button"

- extendedWaitUntil:
    visible:
      id: "goodbye-screen"
    timeout: 20000

# Verify goodbye screen and both buttons

- assertVisible:
    id: "goodbye-reenter-button"

- assertVisible:
    id: "goodbye-landing-page-button"

- takeScreenshot: 02-goodbye-screen

# Tap "Go back to meeting" — navigates to waiting room first
- tapOn:
    id: "goodbye-reenter-button"

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 10000

- takeScreenshot: 03-reenter-waiting-room

# Rejoin the meeting from waiting room
- tapOn:
    id: "join-meeting-button"

- extendedWaitUntil:
    visible:
      id: "meeting-room-screen"
    timeout: 30000

- takeScreenshot: 04-reenter-meeting-room
