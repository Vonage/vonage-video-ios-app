appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow
    arguments:
      VERA_E2E_MOCKS: "${VERA_E2E_MOCKS}"
      VERA_E2E_SCENARIO: "recording"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

# Enter a room name
- tapOn:
    id: "room-name-input"

- inputText: "transcriptionroom"

- tapOn:
    id: "join-waiting-room-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "waiting-room-screen"

# Enter username and join meeting
- tapOn:
    id: "username-input"

- inputText: "Test User"

- tapOn:
    id: "join-meeting-button"

- waitForAnimationToEnd:
    timeout: 10000

- assertVisible:
    id: "meeting-room-screen"

# Start transcription (button may be in overflow menu on smaller screens)
- tapOn:
    id: "meeting-room-more-options-button"
    optional: true

- tapOn:
    id: "archiving-start-transcription-button"

- waitForAnimationToEnd:
    timeout: 3000

# Start transcription from the options sheet (summary on by default)
- assertVisible:
    id: "archiving-transcription-summary-toggle"

- tapOn:
    id: "archiving-transcription-confirm-start-button"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "archiving-transcription-indicator"

- takeScreenshot: 01-transcription-in-progress

# Stop transcription (button may be in overflow menu on smaller screens)
- tapOn:
    id: "meeting-room-more-options-button"
    optional: true

- tapOn:
    id: "archiving-stop-transcription-button"

- waitForAnimationToEnd:
    timeout: 3000

# Confirm stop transcription alert
- tapOn: "OK"

- waitForAnimationToEnd:
    timeout: 5000

- assertNotVisible:
    id: "archiving-transcription-indicator"

# End call
- tapOn:
    id: "meeting-room-end-call-button"

- waitForAnimationToEnd:
    timeout: 15000

- assertVisible:
    id: "goodbye-screen"

- assertVisible:
    id: "archiving-archive-list"

- assertVisible: "Download session content"

# The transcription row appears while the transcript is still being prepared
- extendedWaitUntil:
    visible:
      id: "archiving-transcription-item"
    timeout: 90000

- takeScreenshot: 02-goodbye-transcription-row

# Polling continues until the transcript is ready, even though its archive is already uploaded
- extendedWaitUntil:
    visible:
      id: "archiving-transcription-download-button"
    timeout: 30000

- assertVisible: "Transcription 1"

- takeScreenshot: 03-goodbye-transcription-ready

# Downloading a transcript opens the share sheet instead of the video player
- tapOn:
    id: "archiving-transcription-download-button"

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: 04-transcription-share-sheet
