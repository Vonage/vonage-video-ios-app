# vera-runner: mock-only
appId: ${APP_ID}
---
- launchApp:
    permissions:
      camera: allow
      microphone: allow
    arguments:
      VERA_E2E_MOCKS: "${VERA_E2E_MOCKS}"
      VERA_E2E_SCENARIO: "expiredSessionKey"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "landing-screen"
- tapOn:
    id: "room-name-input"
- inputText: "${ROOM_NAME}"
- tapOn:
    id: "join-waiting-room-button"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: "waiting-room-screen"
- tapOn:
    id: "username-input"
- inputText: "Test User"
- hideKeyboard
- tapOn:
    id: "join-meeting-button"
- extendedWaitUntil:
    visible: "Error"
    timeout: 10000
- takeScreenshot: 01-session-key-expired-error
- tapOn: "OK"
- waitForAnimationToEnd:
    timeout: 3000
- assertNotVisible:
    id: "meeting-room-screen"
- assertVisible:
    id: "waiting-room-screen"
- takeScreenshot: 02-session-key-expired-join
