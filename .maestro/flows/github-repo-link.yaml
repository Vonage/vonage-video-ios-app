appId: ${APP_ID}
---
- launchApp:
    arguments:
      VERA_E2E_MOCKS: "${VERA_E2E_MOCKS}"

- waitForAnimationToEnd:
    timeout: 5000

- assertVisible:
    id: "landing-screen"

# Verify both versions resolve from the installed app bundle.
- assertVisible:
    id: "version-footer"

- assertVisible:
    text: 'v[0-9].* \(SDK [0-9].*\)'

# Verify GitHub button is visible
- assertVisible:
    id: "github-repo-button"

- takeScreenshot: 01-github-button-visible

# Tap the GitHub button (opens external URL)
- tapOn:
    id: "github-repo-button"

- takeScreenshot: 02-after-github-tap
