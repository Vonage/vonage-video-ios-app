appId: ${APP_ID}
---
- launchApp:
    clearState: true
    permissions:
      camera: allow
      microphone: allow

- extendedWaitUntil:
    visible:
      id: "landing-screen"
    timeout: 10000

# Enter a room name
- tapOn:
    id: "room-name-input"

- eraseText

- inputText: "testroom"

- hideKeyboard

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "join-waiting-room-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "waiting-room-screen"
    timeout: 10000

# Verify mic and camera are enabled initially
- assertVisible:
    id: "waiting-room-mic-enabled"

- assertVisible:
    id: "waiting-room-camera-enabled"

# Disable microphone
- tapOn:
    id: "waiting-room-mic-enabled"

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    id: "waiting-room-mic-disabled"

# Disable camera
- tapOn:
    id: "waiting-room-camera-enabled"

- waitForAnimationToEnd:
    timeout: 3000

- assertVisible:
    id: "waiting-room-camera-disabled"

- takeScreenshot: 01-waiting-room-controls-disabled

# Enter username and join meeting
- tapOn:
    id: "username-input"

- eraseText

- inputText: "Test User"

- tapOn:
    id: "waiting-room-screen"
    point: "50%,55%"

- waitForAnimationToEnd:
    timeout: 2000

- tapOn:
    id: "join-meeting-button"
    optional: true

- extendedWaitUntil:
    visible:
      id: "meeting-room-screen"
    timeout: 60000

# Verify mic and camera remain disabled in meeting room
- assertVisible:
    id: "meeting-room-mic-disabled"

- assertVisible:
    id: "meeting-room-camera-disabled"

- takeScreenshot: 02-meeting-room-controls-disabled
