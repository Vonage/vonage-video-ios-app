name: Maestro UI Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  maestro-tests:
    name: Run Maestro UI Tests
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Xcode & Simulator Info
        run: |
          xcodebuild -version
          echo ""
          echo "Available iOS Simulators:"
          xcrun simctl list devices available | grep iPhone

      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash
          echo "$HOME/.tuist/bin" >> $GITHUB_PATH

      - name: Install Java 17 (Maestro dependency)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Project.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Generate Environment Constants
        run: |
          cd VERA
          export BASE_API_URL="${{ secrets.BASE_API_URL || 'https://api.example.net/' }}"
          export DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM || 'AB0C12DE34' }}"
          export MARKETING_VERSION="1.1"
          export CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh
          python3 ./Scripts/generate-app-config.py
          python3 ./Scripts/generate-app-theme.py

      - name: Generate Xcode Workspace
        run: |
          cd VERA
          tuist generate

      - name: Run Maestro Tests
        run: ./scripts/run-maestro-tests.sh
        env:
          BASE_API_URL: ${{ secrets.BASE_API_URL || 'https://api.example.net/' }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM || 'AB0C12DE34' }}
          MARKETING_VERSION: "1.1"
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results-${{ github.run_number }}
          path: ~/.maestro/tests/*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-${{ github.run_number }}
          path: ~/.maestro/tests/*/screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            let comment = '## 🎭 Maestro UI Test Results\n\n';
            if ('${{ job.status }}' === 'success') {
              comment += '✅ **All tests passed!**\n\n';
            } else {
              comment += '❌ **Some tests failed**\n\n';
            }
            comment += `- **Run**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n`;
            comment += `- **Commit**: \`${{ github.sha }}\`\n\n`;
            comment += '📊 View artifacts for detailed reports and screenshots.';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
