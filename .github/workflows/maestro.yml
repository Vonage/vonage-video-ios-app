name: Maestro UI Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  maestro-tests:
    name: Run Maestro UI Tests
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Checkout LFS objects
        run: git lfs pull

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.0'

      - name: Install Tuist
        run: |
          curl -Ls https://install.tuist.io | bash
          echo "$HOME/.tuist/bin" >> $GITHUB_PATH

      - name: Install Java 17 (Maestro dependency)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Verify installations
        run: |
          echo "Tuist version:"
          tuist version
          echo "Java version:"
          java -version
          echo "Maestro version:"
          maestro --version

      - name: Cache Tuist dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/tuist
            ~/.tuist/Cache
          key: ${{ runner.os }}-tuist-${{ hashFiles('**/Project.swift', '**/Tuist/**') }}
          restore-keys: |
            ${{ runner.os }}-tuist-

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-deriveddata-${{ hashFiles('**/Project.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-

      - name: Generate Environment Constants
        run: |
          cd VERA
          export BASE_API_URL="${{ secrets.BASE_API_URL }}"
          export DEVELOPMENT_TEAM="${{ secrets.DEVELOPMENT_TEAM }}"
          export MARKETING_VERSION="1.1"
          export CURRENT_PROJECT_VERSION="${{ github.run_number }}"
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh

      - name: Generate App Config
        run: |
          cd VERA
          python3 ./Scripts/generate-app-config.py

      - name: Generate App Theme
        run: |
          cd VERA
          python3 ./Scripts/generate-app-theme.py

      - name: Generate Xcode Workspace
        run: |
          cd VERA
          tuist generate

      - name: List Available Simulators
        run: |
          xcrun simctl list devices available | grep iPhone

      - name: Run Maestro Tests
        run: ./scripts/run-maestro-tests.sh
        env:
          SIMULATOR_DEVICE: "iPhone 17"
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results-${{ github.run_number }}
          path: ~/.maestro/tests/*
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-screenshots-${{ github.run_number }}
          path: ~/.maestro/tests/*/screenshots/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ github.run_number }}
          path: ~/.maestro/tests/*/*.html
          retention-days: 7
          if-no-files-found: warn

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResult = '${{ job.status }}';
            const runNumber = '${{ github.run_number }}';
            
            let emoji = testResult === 'success' ? '✅' : '❌';
            let status = testResult === 'success' ? 'passed' : 'failed';
            
            const comment = `## ${emoji} Maestro UI Tests ${status}
            
            **Run:** [#${runNumber}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            <details>
            <summary>View test artifacts</summary>
            
            - [Test Results](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [HTML Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            </details>`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
