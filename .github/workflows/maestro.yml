name: Maestro UI Tests

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'VERA/**'
  push:
    branches: [develop]
    paths:
      - 'VERA/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-tests:
    name: Run Maestro UI Tests
    runs-on: macos-26-xlarge
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Pull LFS files
        run: git lfs pull

      - name: Print Xcode & Simulator Info
        run: |
          xcodebuild -version
          echo ""
          echo "Available iOS Simulators:"
          xcrun simctl list devices available | grep iPhone

      - name: Install Tuist
        run: brew install tuist

      - name: Clean Tuist cache
        run: |
          echo "🧹 Cleaning Tuist cache to avoid cross-branch contamination"
          tuist clean
          rm -rf ~/.cache/tuist

      - name: Install Java 17 (Maestro dependency)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Export build flags
        run: |
          {
            echo 'XCODE_COMMON_FLAGS=COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO RUN_SWIFTLINT=NO'
          } >> "$GITHUB_ENV"

      - name: Generate project with Tuist
        run: |
          cd VERA
          export DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          export BASE_API_URL=${{ secrets.BASE_API_URL }}
          export MARKETING_VERSION=1.0
          export CURRENT_PROJECT_VERSION=${{ github.run_number }}
          export OKTA_ISSUER_URL=${{ secrets.OKTA_ISSUER_URL }}
          export OKTA_CLIENT_ID=${{ secrets.OKTA_CLIENT_ID }}
          export OKTA_REDIRECT_URI=${{ secrets.OKTA_REDIRECT_URI }}
          export OKTA_LOGOUT_REDIRECT_URI=${{ secrets.OKTA_LOGOUT_REDIRECT_URI }}
          jq '.authSettings.allowAuthentication = true | .authSettings.idProviders |= (if contains(["okta"]) then . else . + ["okta"] end)' Config/app-config.json > Config/app-config.tmp && mv Config/app-config.tmp Config/app-config.json
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh
          ./Scripts/generateOktaConfig.sh
          tuist install
          tuist generate --no-open
          cd ..

      - name: List available simulators
        run: |
          echo "📱 Available iOS Simulators:"
          xcrun simctl list devices

      - name: Compute unique room name
        id: room
        run: echo "name=maestro-${{ github.run_id }}${{ github.event.pull_request.number && format('-pr{0}', github.event.pull_request.number) || '' }}" >> "$GITHUB_OUTPUT"

      - name: Run Maestro Tests
        run: ./scripts/run-maestro-tests.sh
        env:
          ROOM_NAME: ${{ steps.room.outputs.name }}
          BASE_API_URL: ${{ secrets.BASE_API_URL }}
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          MARKETING_VERSION: "1.0"
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
          OKTA_ISSUER_URL: ${{ secrets.OKTA_ISSUER_URL }}
          OKTA_CLIENT_ID: ${{ secrets.OKTA_CLIENT_ID }}
          OKTA_REDIRECT_URI: ${{ secrets.OKTA_REDIRECT_URI }}
          OKTA_LOGOUT_REDIRECT_URI: ${{ secrets.OKTA_LOGOUT_REDIRECT_URI }}
          XCODE_COMMON_FLAGS: ${{ env.XCODE_COMMON_FLAGS }}

      - name: List Maestro test artifacts
        if: always()
        run: |
          echo "📁 Maestro test directory contents:"
          ls -la ~/.maestro/tests/ 2>/dev/null || echo "No tests directory"
          
          echo ""
          echo "📸 Screenshots found:"
          find ~/.maestro/tests -type f \( -name "*.png" -o -name "*.jpg" \) 2>/dev/null | head -20

      - name: Generate Test Report
        if: always()
        run: |
          mkdir -p test-reports
          cat > test-reports/maestro-summary.txt << EOF
          🎭 Maestro Test Execution Summary
          ==================================
          Run Number: ${{ github.run_number }}
          Timestamp: $(date)
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          
          Test Results Location:
          ~/.maestro/tests/
          
          Screenshots and test artifacts have been uploaded below.
          EOF
          
          # Copy test results to reports folder
          if [ -d ~/.maestro/tests ]; then
            cp -r ~/.maestro/tests/* test-reports/ 2>/dev/null || true
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-test-results-${{ github.run_number }}
          path: ~/.maestro/tests/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ github.run_number }}
          path: test-reports/
          retention-days: 7
          if-no-files-found: warn

  comment-pr:
    name: Update PR Comment
    needs: maestro-tests
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Update PR Comment with Results
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- maestro-e2e-results -->';
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const result = ${{ toJson(needs.maestro-tests.result) }};
            const overallStatus = result === 'success'
              ? '✅ **All tests passed!**'
              : '❌ **Some tests failed**';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const timestamp = new Date().toISOString();
            const entry = `- ${timestamp} — [Run #${context.runNumber}](${runUrl}) — commit \`${context.sha.substring(0, 7)}\` — ${result === 'success' ? '✅ passed' : '❌ failed'}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const previous = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            const historyStart = '<!-- history-start -->';
            const historyEnd = '<!-- history-end -->';
            let history = [];
            if (previous) {
              const s = previous.body.indexOf(historyStart);
              const e = previous.body.indexOf(historyEnd);
              if (s !== -1 && e !== -1) {
                history = previous.body
                  .substring(s + historyStart.length, e)
                  .split('\n').map(l => l.trim()).filter(Boolean);
              }
            }
            history.unshift(entry);
            history = history.slice(0, 10);

            const body = [
              marker,
              '## 🎭 Maestro E2E Test Results',
              '',
              overallStatus,
              '',
              `- **Run**: [#${context.runNumber}](${runUrl})`,
              `- **Commit**: \`${context.sha}\``,
              '',
              `📊 **Artifacts:** maestro-report-${context.runNumber} (see the run above)`,
              '',
              '<details>',
              `<summary>📜 Run history (last ${history.length})</summary>`,
              '',
              historyStart,
              history.join('\n'),
              historyEnd,
              '',
              '</details>',
            ].join('\n');

            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
