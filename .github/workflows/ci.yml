name: CI

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'VERA/**'
      - 'Package.swift'
      - 'scripts/select-package-language-mode.py'
      - 'scripts/verify-package-language-modes.py'
      - 'Tests/ConsumerCompatibility/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'VERA/**'
      - 'Package.swift'
      - 'scripts/select-package-language-mode.py'
      - 'scripts/verify-package-language-modes.py'
      - 'Tests/ConsumerCompatibility/**'
      - '.github/workflows/ci.yml'

jobs:
  format-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install swift-format
        run: |
          brew install swift-format
          swift-format --version
  
      - name: Validate localization catalogs
        run: python3 scripts/validate-localizations.py

      - name: Check Swift formatting
        run: |
          chmod +x scripts/format.sh
          ./scripts/format.sh --check
          swift-format lint --strict --recursive Tests/ConsumerCompatibility

  spm-modes:
    runs-on: macos-26
    needs: [format-check]
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.0", "6.0"]
    env:
      TUIST_SWIFT_LANGUAGE_MODE: ${{ matrix.swift }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Record compiler and selected language mode
        run: |
          xcodebuild -version
          swift --version
          echo "Owned package language mode: $TUIST_SWIFT_LANGUAGE_MODE"

      - name: Select the package language mode explicitly
        run: python3 scripts/select-package-language-mode.py "$TUIST_SWIFT_LANGUAGE_MODE"

      - name: Build SPM package (VERAMeetingRoomSDK) for iOS
        run: |
          xcodebuild build \
            -scheme VERAMeetingRoomSDK \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO | tee PackageBuild.log | xcpretty

      - name: Compile Swift 5 and Swift 6 public API consumers
        run: |
          xcodebuild build-for-testing \
            -scheme VERAMeetingRoomSDK \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO | tee PackageTestsBuild.log | xcpretty

      - name: Verify the actual SDK and customer compiler modes
        run: |
          python3 scripts/verify-package-language-modes.py \
            "$TUIST_SWIFT_LANGUAGE_MODE" PackageBuild.log PackageTestsBuild.log

  spm-build:
    runs-on: ubuntu-24.04
    needs: [spm-modes]
    if: always()
    steps:
      - name: Require both package language modes to pass
        env:
          PACKAGE_RESULT: ${{ needs.spm-modes.result }}
        run: test "$PACKAGE_RESULT" = success

  tests:
    name: tests (${{ matrix.name }}, Swift ${{ matrix.swift }})
    runs-on: macos-26
    needs: [format-check]
    env:
      TUIST_SWIFT_LANGUAGE_MODE: ${{ matrix.swift }}
    defaults:
      run:
        shell: bash
    strategy:
      # Let every leg finish so one failure doesn't hide the others; a failed leg
      # can be re-run on its own via "Re-run failed jobs".
      fail-fast: false
      matrix:
        include:
          - name: macOS
            swift: "5.0"
            scheme: VERAUnitTests-macOS
            destination: platform=macOS
            simulator: false
            timeout: 25
            extra_flags: ""
          - name: iOS
            swift: "5.0"
            scheme: VERAUnitTests-iOS
            destination: platform=iOS Simulator,name=iPhone 17
            simulator: true
            timeout: 45
            extra_flags: ""
          - name: macOS
            swift: "6.0"
            scheme: VERAUnitTests-macOS
            destination: platform=macOS
            simulator: false
            timeout: 25
            extra_flags: ""
          - name: iOS
            swift: "6.0"
            scheme: VERAUnitTests-iOS
            destination: platform=iOS Simulator,name=iPhone 17
            simulator: true
            timeout: 45
            extra_flags: ""
          - name: snapshots
            swift: "6.0"
            scheme: VERASnapshotTests-iOS
            destination: platform=iOS Simulator,name=iPhone 17
            simulator: true
            timeout: 45
            extra_flags: -parallel-testing-enabled NO

    steps:
      - uses: actions/checkout@v6
    
      - name: Record compiler and selected language mode
        run: |
          xcodebuild -version
          swift --version
          echo "Owned Tuist language mode: $TUIST_SWIFT_LANGUAGE_MODE"

      - name: Pull LFS files
        run: git lfs pull
    
      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Install Tuist
        run: brew install tuist

      - name: Clean Tuist cache
        run: |
          echo "🧹 Cleaning Tuist cache to avoid cross-branch contamination"
          tuist clean
          rm -rf ~/.cache/tuist

      - name: Generate project with Tuist
        run: |
          cd VERA
          export DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          export BASE_API_URL=${{ secrets.BASE_API_URL }}
          export OKTA_ISSUER_URL=${{ secrets.OKTA_ISSUER_URL }}
          export OKTA_CLIENT_ID=${{ secrets.OKTA_CLIENT_ID }}
          export OKTA_REDIRECT_URI=${{ secrets.OKTA_REDIRECT_URI }}
          export OKTA_LOGOUT_REDIRECT_URI=${{ secrets.OKTA_LOGOUT_REDIRECT_URI }}
          jq '.authSettings.allowAuthentication = true | .authSettings.idProviders |= (if contains(["okta"]) then . else . + ["okta"] end)' Config/app-config.json > Config/app-config.tmp && mv Config/app-config.tmp Config/app-config.json
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh
          ./Scripts/generateOktaConfig.sh
          tuist install
          tuist generate --no-open
          cd ..

      - name: List available simulators
        if: matrix.simulator
        run: |
          echo "📱 Available iOS Simulators:"
          xcrun simctl list devices

      - name: Export build flags
        run: |
          {
            echo 'XCODE_COMMON_FLAGS=COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO RUN_SWIFTLINT=NO'
          } >> $GITHUB_ENV

      - name: Preboot iOS Simulator
        if: matrix.simulator
        run: |
          xcrun simctl boot "iPhone 17" || true

      - name: Compile the app and broadcast extension
        if: matrix.name == 'iOS'
        timeout-minutes: 25
        run: |
          xcodebuild build \
            -workspace VERA/VERA.xcworkspace \
            -scheme VERA \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO RUN_SWIFTLINT=NO | xcpretty

      - name: Run ${{ matrix.scheme }}
        timeout-minutes: ${{ matrix.timeout }}
        run: |
          echo "🧪 Running ${{ matrix.scheme }} on ${{ matrix.destination }} (single invocation)"
          xcodebuild test \
            -workspace VERA/VERA.xcworkspace \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath "TestResults/${{ matrix.scheme }}-swift${{ matrix.swift }}.xcresult" \
            ${{ matrix.extra_flags }} \
            $XCODE_COMMON_FLAGS | xcpretty

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.name }}-swift${{ matrix.swift }}
          path: TestResults/
          overwrite: true

  # Aggregates into the single "unit-tests" status that branch protection
  # requires and that sonarcloud / upload-testflight depend on. It runs even when a
  # leg fails, so the required check always reports instead of staying pending.
  unit-tests:
    runs-on: ubuntu-24.04
    needs: [tests, spm-build]
    if: always()
    steps:
      - name: Require every test leg to pass
        run: |
          echo "tests matrix result: ${{ needs.tests.result }}"
          if [ "${{ needs.tests.result }}" != "success" ] || [ "${{ needs.spm-build.result }}" != "success" ]; then
            echo "::error::A test or package language-mode leg did not succeed. Check the matrix jobs."
            exit 1
          fi

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: macos-26
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
    
      - name: Download unit test results
        uses: actions/download-artifact@v8
        with:
          pattern: test-results-*
          merge-multiple: true
          path: DerivedData/
    
      - name: Install dependencies
        run: |
          brew update
          brew install sonar-scanner coreutils

      - name: Merge coverage from ./DerivedData
        run: |
          ./scripts/merge_coverage.sh

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Dynamically find all test directories (ending in "Tests")
          TESTS_DIRS=$(find VERA -type d -name "*Tests" \
            | grep -v "DerivedData" \
            | grep -v ".build" \
            | grep -v "__Snapshots__" \
            | sort \
            | tr '\n' ',' \
            | sed 's/,$//')
        
          echo "📋 Test directories found:"
          echo "$TESTS_DIRS" | tr ',' '\n'
        
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.tests="$TESTS_DIRS" \
            -Dsonar.verbose=true

  upload-testflight:
    name: Upload to TestFlight
    runs-on: macos-26
    needs: [unit-tests]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v6
    
      - name: Pull LFS files
        run: git lfs pull
    
      - name: Install Tuist
        run: brew install tuist

      - name: Import certs
        uses: Apple-Actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v5
        with:
          profile-type: IOS_APP_STORE
          bundle-id: 'com.vonage.VERA'
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Provisioning profile (BroadcastExtension)
        uses: Apple-Actions/download-provisioning-profiles@v5
        with:
          profile-type: IOS_APP_STORE
          bundle-id: 'com.vonage.VERA.BroadcastExtension'
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Generate build number
        id: buildnumber
        run: |
          # Generate build number with only numeric values for App Store compatibility
          # Use timestamp to ensure uniqueness and avoid conflicts
          TIMESTAMP=$(date +%s)
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${TIMESTAMP: -6}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Generated build number: $BUILD_NUMBER"

      - name: Generate project with Tuist
        run: |
          cd VERA
          export DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          export CURRENT_PROJECT_VERSION=${{ steps.buildnumber.outputs.BUILD_NUMBER }}
          export BASE_API_URL=${{ secrets.BASE_API_URL }}
          export OKTA_ISSUER_URL=${{ secrets.OKTA_ISSUER_URL }}
          export OKTA_CLIENT_ID=${{ secrets.OKTA_CLIENT_ID }}
          export OKTA_REDIRECT_URI=${{ secrets.OKTA_REDIRECT_URI }}
          export OKTA_LOGOUT_REDIRECT_URI=${{ secrets.OKTA_LOGOUT_REDIRECT_URI }}
          jq '.authSettings.allowAuthentication = true | .authSettings.idProviders |= (if contains(["okta"]) then . else . + ["okta"] end)' Config/app-config.json > Config/app-config.tmp && mv Config/app-config.tmp Config/app-config.json
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh
          ./Scripts/generateOktaConfig.sh
          tuist install
          tuist generate --no-open
          cd ..

      - name: Build archive
        run: |
            echo "Building archive with build number: ${{ steps.buildnumber.outputs.BUILD_NUMBER }}"
            xcodebuild -workspace VERA/VERA.xcworkspace \
              -scheme VERA \
              -sdk iphoneos \
              -configuration Release \
              -allowProvisioningUpdates \
              -archivePath $PWD/build/VERA.xcarchive \
              CURRENT_PROJECT_VERSION="${{ steps.buildnumber.outputs.BUILD_NUMBER }}" \
              archive

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
              -archivePath "$PWD/build/VERA.xcarchive" \
              -exportOptionsPlist "$PWD/VERA/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -exportPath "$PWD/build"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3.0.1
        with:
          app-path: build/VERA.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
