name: CI

permissions:
  contents: write
  actions: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  format-check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6

      - name: Install swift-format
        run: |
          brew install swift-format
          swift-format --version
  
      - name: Check Swift formatting
        run: |
          chmod +x scripts/format.sh
          ./scripts/format.sh --check

  spm-build:
    runs-on: macos-26
    needs: [format-check]
    steps:
      - uses: actions/checkout@v6

      - name: Build SPM package (VERAMeetingRoomSDK) for iOS
        run: |
          xcodebuild build \
            -scheme VERAMeetingRoomSDK \
            -destination "generic/platform=iOS Simulator" | xcpretty

  unit-tests:
    runs-on: macos-26
    needs: [format-check]
    defaults:
      run:
        shell: bash
    outputs:
      test-results: ${{ steps.tests.outcome }}
    
    steps:
      - uses: actions/checkout@v6
    
      - name: Pull LFS files
        run: git lfs pull
    
      - name: Install SwiftLint
        run: |
          brew install swiftlint

      - name: Install Tuist
        run: brew install tuist

      - name: Clean Tuist cache
        run: |
          echo "🧹 Cleaning Tuist cache to avoid cross-branch contamination"
          tuist clean
          rm -rf ~/.cache/tuist

      - name: Generate project with Tuist
        run: |
          cd VERA
          export DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          export BASE_API_URL=${{ secrets.BASE_API_URL }}
          export OKTA_ISSUER_URL=${{ secrets.OKTA_ISSUER_URL }}
          export OKTA_CLIENT_ID=${{ secrets.OKTA_CLIENT_ID }}
          export OKTA_REDIRECT_URI=${{ secrets.OKTA_REDIRECT_URI }}
          export OKTA_LOGOUT_REDIRECT_URI=${{ secrets.OKTA_LOGOUT_REDIRECT_URI }}
          jq '.authSettings.allowAuthentication = true | .authSettings.idProviders |= (if contains(["okta"]) then . else . + ["okta"] end)' Config/app-config.json > Config/app-config.tmp && mv Config/app-config.tmp Config/app-config.json
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh
          ./Scripts/generateOktaConfig.sh
          tuist generate --no-open
          cd ..

      - name: List available simulators
        run: |
          echo "📱 Available iOS Simulators:"
          xcrun simctl list devices

      - name: Export build flags
        run: |
          {
            echo 'XCODE_COMMON_FLAGS=COMPILER_INDEX_STORE_ENABLE=NO ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO RUN_SWIFTLINT=NO'
          } >> $GITHUB_ENV

      - name: Run unit tests (macOS)
        id: unit-tests-macos
        timeout-minutes: 25
        run: |
          echo "🧪 Running VERAUnitTests-macOS (all macOS unit test targets, single invocation)"
          xcodebuild test \
            -workspace VERA/VERA.xcworkspace \
            -scheme VERAUnitTests-macOS \
            -destination "platform=macOS" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath DerivedData/VERAUnitTests-macOS.xcresult \
            $XCODE_COMMON_FLAGS | xcpretty

      - name: Run VERAOKTATests (macOS)
      id: okta-tests-macos
      run: |
        echo "🧪 Running VERAOKTATests on macOS"
        xcodebuild test \
          -workspace VERA/VERA.xcworkspace \
          -scheme VERAOKTATests \
          -destination "platform=macOS" \
          -derivedDataPath DerivedData \
          -enableCodeCoverage YES \
          -resultBundlePath DerivedData/VERAOKTATests-macOS.xcresult \
          $XCODE_COMMON_FLAGS | xcpretty

    - name: Preboot iOS Simulator
        run: |
          set -euo pipefail
          xcrun simctl boot "iPhone 17" || true 

      - name: Run unit tests (iOS Simulator)
        id: unit-tests-ios
        timeout-minutes: 45
        run: |
          echo "🧪 Running VERAUnitTests-iOS (all iOS unit and plugin test targets, single invocation)"
          xcodebuild test \
            -workspace VERA/VERA.xcworkspace \
            -scheme VERAUnitTests-iOS \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath DerivedData/VERAUnitTests-iOS.xcresult \
            $XCODE_COMMON_FLAGS | xcpretty

      - name: Run snapshot tests (iOS Simulator)
        id: snapshot-tests-ios
        timeout-minutes: 45
        run: |
          echo "📸 Running VERASnapshotTests-iOS (all snapshot test targets, single invocation)"
          xcodebuild test \
            -workspace VERA/VERA.xcworkspace \
            -scheme VERASnapshotTests-iOS \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath DerivedData \
            -enableCodeCoverage YES \
            -resultBundlePath DerivedData/VERASnapshotTests-iOS.xcresult \
            -parallel-testing-enabled NO \
            $XCODE_COMMON_FLAGS | xcpretty

      - name: Upload all test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-results
          path: |
            DerivedData/VERAUnitTests-macOS.xcresult
            DerivedData/VERAUnitTests-iOS.xcresult
            DerivedData/VERASnapshotTests-iOS.xcresult
          
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: macos-26
    needs: [unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
    
      - name: Download unit test results
        uses: actions/download-artifact@v8
        with:
          name: unit-test-results
          path: DerivedData/
    
      - name: Install dependencies
        run: |
          brew update
          brew install sonar-scanner coreutils

      - name: Merge coverage from ./DerivedData
        run: |
          ./scripts/merge_coverage.sh

      - name: SonarCloud Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          # Dynamically find all test directories (ending in "Tests")
          TESTS_DIRS=$(find VERA -type d -name "*Tests" \
            | grep -v "DerivedData" \
            | grep -v ".build" \
            | grep -v "__Snapshots__" \
            | sort \
            | tr '\n' ',' \
            | sed 's/,$//')
        
          echo "📋 Test directories found:"
          echo "$TESTS_DIRS" | tr ',' '\n'
        
          sonar-scanner \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.tests="$TESTS_DIRS" \
            -Dsonar.verbose=true

  upload-testflight:
    name: Upload to TestFlight
    runs-on: macos-26
    needs: [unit-tests]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && github.event_name == 'push'
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v6
    
      - name: Pull LFS files
        run: git lfs pull
    
      - name: Install Tuist
        run: brew install tuist

      - name: Import certs
        uses: Apple-Actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Provisioning profile
        uses: Apple-Actions/download-provisioning-profiles@v5
        with:
          profile-type: IOS_APP_STORE
          bundle-id: 'com.vonage.VERA'
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Provisioning profile (BroadcastExtension)
        uses: Apple-Actions/download-provisioning-profiles@v5
        with:
          profile-type: IOS_APP_STORE
          bundle-id: 'com.vonage.VERA.BroadcastExtension'
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Generate build number
        id: buildnumber
        run: |
          # Generate build number with only numeric values for App Store compatibility
          # Use timestamp to ensure uniqueness and avoid conflicts
          TIMESTAMP=$(date +%s)
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${TIMESTAMP: -6}"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Generated build number: $BUILD_NUMBER"

      - name: Generate project with Tuist
        run: |
          cd VERA
          export DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM }}
          export CURRENT_PROJECT_VERSION=${{ steps.buildnumber.outputs.BUILD_NUMBER }}
          export BASE_API_URL=${{ secrets.BASE_API_URL }}
          ./Scripts/generateEnvironmentConstants.sh
          ./Scripts/regenerateSigningConfig.sh
          tuist generate --no-open
          cd ..

      - name: Build archive
        run: |
            echo "Building archive with build number: ${{ steps.buildnumber.outputs.BUILD_NUMBER }}"
            xcodebuild -workspace VERA/VERA.xcworkspace \
              -scheme VERA \
              -sdk iphoneos \
              -configuration Release \
              -allowProvisioningUpdates \
              -archivePath $PWD/build/VERA.xcarchive \
              CURRENT_PROJECT_VERSION="${{ steps.buildnumber.outputs.BUILD_NUMBER }}" \
              archive | xcpretty

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
              -archivePath "$PWD/build/VERA.xcarchive" \
              -exportOptionsPlist "$PWD/VERA/ExportOptions.plist" \
              -allowProvisioningUpdates \
              -exportPath "$PWD/build" | xcpretty

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3.0.1
        with:
          app-path: build/VERA.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
