name: Notify Slack on Release

on:
  release:
    types: [published]
  # TEMPORARY: manual trigger to test the Slack notification. Remove after testing.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to notify about (e.g. 1.3.0)"
        required: true

permissions:
  contents: read

jobs:
  notify-release:
    runs-on: ubuntu-24.04
    name: Notify Release
    steps:
      - name: Build Slack payload
        id: payload
        env:
          # For release events these come from the event context; for manual
          # runs they are empty and the release is fetched by tag below.
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          # TEMPORARY: inputs for the manual test trigger.
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # TEMPORARY: on manual dispatch, load the release fields by tag so the
          # test uses the real release body. Remove with the workflow_dispatch trigger.
          if [ -n "$INPUT_TAG" ]; then
            RELEASE_NAME=$(gh release view "$INPUT_TAG" --json name --jq '.name')
            RELEASE_BODY=$(gh release view "$INPUT_TAG" --json body --jq '.body')
            RELEASE_URL=$(gh release view "$INPUT_TAG" --json url --jq '.url')
          fi

          # Build the payload with jq so the release body is JSON-escaped
          # correctly (quotes, newlines, '#', '<', '>' are all handled).
          # The body is passed via env var and never interpolated into YAML/JSON
          # text, which is what broke on release bodies containing Markdown
          # headers and blank lines.
          jq -n \
            --arg name "$RELEASE_NAME" \
            --arg body "$RELEASE_BODY" \
            --arg url "$RELEASE_URL" \
            '{
              blocks: [
                {
                  type: "header",
                  text: {
                    type: "plain_text",
                    text: (":tada: Version " + $name + " of the Vonage Native iOS Video Reference App Just Released!")
                  }
                },
                {
                  type: "section",
                  text: { type: "mrkdwn", text: $body }
                },
                { type: "divider" },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("You can view the full change log <" + $url + "|here>")
                  }
                }
              ]
            }' > "${RUNNER_TEMP}/slack-payload.json"
          echo "path=${RUNNER_TEMP}/slack-payload.json" >> "$GITHUB_OUTPUT"

      - name: Send to slack channels
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload-file-path: ${{ steps.payload.outputs.path }}
