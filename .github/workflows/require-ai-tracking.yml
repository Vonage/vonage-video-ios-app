name: Require AI Tracking
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
permissions:
  pull-requests: write
  issues: write

jobs:
  check-tracking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch git-ai notes
        run: git fetch origin refs/notes/ai:refs/notes/ai 2>/dev/null || true

      - name: Check AI tracking
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');

            // Allow bypass via label
            const labels = context.payload.pull_request.labels.map(l => l.name);
            if (labels.includes('ai-tracking-bypass')) {
              console.log('Bypass label present — skipping check.');
              return;
            }

            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;

            const commits = execSync(`git log ${base}..${head} --format="%H" --no-merges`)
              .toString().trim().split('\n').filter(Boolean);

            if (commits.length === 0) return;

            let tracked = 0;
            for (const sha of commits) {
              try {
                execSync(`git notes --ref=refs/notes/ai show ${sha}`, { stdio: 'pipe' });
                tracked++;
              } catch {}
            }

            if (tracked === 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `❌ **AI Tracking not configured**: none of the ${commits.length} commits have git-ai notes.\n\nTo fix: ensure git-ai is installed and hooks are active.\n\nTo bypass: add the \`ai-tracking-bypass\` label to this PR (use sparingly — this is auditable).`
              });
              core.setFailed('No git-ai notes found. Add ai-tracking-bypass label to override.');
            }
