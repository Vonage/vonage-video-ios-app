name: Feature Request
description: File a feature request.
title: '[Feature Request]: '
labels: ['enhancement', 'triage']
body:
  - type: checkboxes
    id: known-request
    attributes:
      label: Is this a known issue?
      description: Please search through our [Known Issues](../../docs/KNOWN_ISSUES.md) to see if this feature has been requested.
      options:
        - label: I have searched the existing issues
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: How do you plan to approach it?
    validations:
      required: true

  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives considered
      description: What other options did you evaluate, and why did you rule them out?

  - type: textarea
    id: architectural-impact
    attributes:
      label: Architectural impact
      description: Does this affect existing layers, patterns, or contracts in the codebase? See our [Architecture docs](../../docs/ARCHITECTURE.md).

  - type: markdown
    attributes:
      value: |
        Non-trivial feature requests should be discussed and approved in this issue before a pull request is opened. See our [Contributing guidelines](../../docs/CONTRIBUTING.md).

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../../CODE_OF_CONDUCT.md).
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
